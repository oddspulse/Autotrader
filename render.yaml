services:
  - type: web
    name: autotrader-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build --workspace=shared && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SOLANA_NETWORK
        value: mainnet-beta
      - key: EXCHANGE
        value: drift
      - key: SYMBOLS
        value: BTC,ETH,SOL,HYPE,ZEC
      - key: ACTIVE_SYMBOL
        value: SOL
      - key: ALLOCATION_PCT
        value: 0.60
      - key: MAX_LEVERAGE
        value: 10
      - key: TAKE_PROFIT_PCT
        value: 0.20
      - key: STOP_LOSS_PCT
        value: 0.05
      - key: TIMEFRAME
        value: 5m
      - key: SIGNAL_STRATEGY
        value: ema_crossover
      - key: EMA_FAST
        value: 9
      - key: EMA_SLOW
        value: 21
      - key: DAILY_LOSS_CAP_PCT
        value: 0.03
      - key: MAX_CONSECUTIVE_LOSSES
        value: 3
      - key: CONSECUTIVE_LOSS_COOLDOWN_HOURS
        value: 6
      - key: MAX_SLIPPAGE_PCT
        value: 0.003
      - key: ORDER_TIMEOUT_SECONDS
        value: 30
      - key: MAX_RETRIES
        value: 3
      - key: PAPER_TRADING
        value: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/trades.db
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
